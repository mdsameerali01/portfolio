<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo in Circle (Image Tag)</title>
    <style>
        /* Circle container styling */
        .circle {
            width: 40px;
            height: 40px;
            background-color: #e0a800; /* Dark yellow color */
            border-radius: 50%; /* Makes the shape circular */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Ensures image stays inside the circle */
        }

        /* Image styling */
        .circle img {
            width: 70%; /* Adjust size of the image inside the circle */
            height: 70%;
        }
    </style>
</head>
<body>

    <!-- Circle with image inside -->
    <div class="circle">
        <img src="logo.png" alt="Logo"> <!-- Replace 'logo.png' with your logo URL -->
    </div>

</body>
</html>
